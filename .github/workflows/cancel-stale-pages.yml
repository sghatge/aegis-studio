name: Cancel stale Pages deployment (one-off)
on:
  push:
    paths: ['.github/workflows/cancel-stale-pages.yml']
permissions:
  pages: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/pages/deployments/262ccaad08825725d29288c08864e83f28725d62 || true
          gh api -X POST repos/${{ github.repository }}/pages/deployments/262ccaad08825725d29288c08864e83f28725d62/cancel && echo CANCELLED
